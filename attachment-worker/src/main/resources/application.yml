server:
  port: 8086

spring:
  application:
    name: attachment-worker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mailvault}
    username: ${DB_USERNAME:mailvault}
    password: ${DB_PASSWORD:mailvault}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.mailvault.attachmentworker.events.AttachmentUploadedEvent

mailvault:
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:mailvault}
    secret-key: ${MINIO_SECRET_KEY:mailvault-secret}
    bucket: ${MINIO_BUCKET:mailvault-emails}
  kafka:
    attachment-uploaded-topic: ${ATTACHMENT_UPLOADED_TOPIC:attachment.uploaded}
    consumer-group-id: ${ATTACHMENT_WORKER_GROUP_ID:mailvault-attachment-worker}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
