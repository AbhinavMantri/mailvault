server:
  port: 8087

spring:
  application:
    name: delivery-service
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:3025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
