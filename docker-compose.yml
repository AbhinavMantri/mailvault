services:
  postgres:
    image: postgres:16-alpine
    container_name: mailvault-postgres
    environment:
      POSTGRES_DB: mailvault
      POSTGRES_USER: mailvault
      POSTGRES_PASSWORD: mailvault
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailvault -d mailvault"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: mailvault-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mailvault
      MINIO_ROOT_PASSWORD: mailvault-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  kafka:
    image: apache/kafka:3.7.2
    container_name: mailvault-kafka
    ports:
      - "9092:9092"

  redis:
    image: redis:7-alpine
    container_name: mailvault-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  greenmail:
    image: greenmail/standalone:2.1.8
    container_name: mailvault-greenmail
    environment:
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled"
    ports:
      - "3025:3025"
      - "8088:8080"

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: mailvault-opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

volumes:
  postgres-data:
  minio-data:
  redis-data:
  opensearch-data:
