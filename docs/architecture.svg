<svg width="1600" height="1200" viewBox="0 0 1600 1200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MailVault high-level architecture</title>
  <desc id="desc">LinkedIn-style high-level architecture diagram for MailVault showing ingestion, hybrid storage, Kafka asynchronous processing, search, quota, archival, and observability.</desc>
  <defs>
    <style>
      .title { font: 700 58px Arial, Helvetica, sans-serif; fill: #111827; }
      .subtitle { font: 400 25px Arial, Helvetica, sans-serif; fill: #4b5563; }
      .group-title { font: 700 24px Arial, Helvetica, sans-serif; fill: #334155; }
      .group-note { font: 400 18px Arial, Helvetica, sans-serif; fill: #64748b; }
      .box-title { font: 700 26px Arial, Helvetica, sans-serif; fill: #111827; }
      .box-body { font: 400 19px Arial, Helvetica, sans-serif; fill: #374151; }
      .small { font: 400 17px Arial, Helvetica, sans-serif; fill: #4b5563; }
      .label { font: 700 17px Arial, Helvetica, sans-serif; fill: #334155; }
      .white-title { font: 700 28px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .white-small { font: 400 19px Arial, Helvetica, sans-serif; fill: #dbeafe; }
      .arrow { stroke: #334155; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .soft-arrow { stroke: #64748b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 10 10; }
      .event-arrow { stroke: #ea580c; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .box { stroke-width: 3; rx: 20; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <marker id="softArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="eventArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/>
    </marker>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1600" y2="1200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8fafc"/>
      <stop offset="0.54" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="kafkaBg" x1="455" y1="905" x2="1305" y2="1028" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-12%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1600" height="1200" fill="url(#pageBg)"/>
  <rect x="64" y="56" width="1472" height="1088" rx="36" fill="#ffffff" fill-opacity="0.86" stroke="#d8e2ee" stroke-width="2"/>

  <text x="116" y="128" class="title">MailVault Email Storage HLD</text>
  <text x="116" y="174" class="subtitle">Hybrid storage design for mailbox scale, search, quota pressure, and archival cost control</text>

  <rect x="112" y="248" width="260" height="150" class="box" fill="#dbeafe" stroke="#2563eb" filter="url(#shadow)"/>
  <text x="242" y="310" text-anchor="middle" class="box-title">Client Apps</text>
  <text x="242" y="352" text-anchor="middle" class="box-body">Import email</text>
  <text x="242" y="381" text-anchor="middle" class="box-body">Read mailbox</text>

  <path class="arrow" d="M242 398 L242 498" marker-end="url(#arrow)"/>
  <text x="274" y="462" class="label">HTTP APIs</text>

  <rect x="112" y="508" width="260" height="150" class="box" fill="#cffafe" stroke="#0891b2" filter="url(#shadow)"/>
  <text x="242" y="570" text-anchor="middle" class="box-title">API Layer</text>
  <text x="242" y="612" text-anchor="middle" class="box-body">Routing, auth,</text>
  <text x="242" y="641" text-anchor="middle" class="box-body">request boundaries</text>

  <rect x="430" y="225" width="880" height="635" rx="30" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <text x="470" y="275" class="group-title">Core MailVault Services</text>
  <text x="470" y="307" class="group-note">The critical path stores durable truth first. Expensive work moves behind Kafka.</text>

  <path class="arrow" d="M372 583 L420 583" marker-end="url(#arrow)"/>
  <text x="382" y="556" class="label">service calls</text>

  <rect x="455" y="360" width="250" height="145" class="box" fill="#eef2ff" stroke="#4f46e5" filter="url(#shadow)"/>
  <text x="580" y="412" text-anchor="middle" class="box-title">Ingestion</text>
  <text x="580" y="452" text-anchor="middle" class="box-body">Validate, store,</text>
  <text x="580" y="481" text-anchor="middle" class="box-body">publish event</text>

  <rect x="745" y="360" width="250" height="145" class="box" fill="#ecfdf5" stroke="#16a34a" filter="url(#shadow)"/>
  <text x="870" y="412" text-anchor="middle" class="box-title">Mailbox</text>
  <text x="870" y="452" text-anchor="middle" class="box-body">Inbox, detail,</text>
  <text x="870" y="481" text-anchor="middle" class="box-body">labels, archive</text>

  <rect x="1035" y="360" width="250" height="145" class="box" fill="#faf5ff" stroke="#9333ea" filter="url(#shadow)"/>
  <text x="1160" y="412" text-anchor="middle" class="box-title">Search API</text>
  <text x="1160" y="452" text-anchor="middle" class="box-body">Query index,</text>
  <text x="1160" y="481" text-anchor="middle" class="box-body">resolve canonical state</text>

  <rect x="455" y="620" width="250" height="145" class="box" fill="#fff7ed" stroke="#f97316" filter="url(#shadow)"/>
  <text x="580" y="672" text-anchor="middle" class="box-title">Quota Service</text>
  <text x="580" y="712" text-anchor="middle" class="box-body">Usage accounting,</text>
  <text x="580" y="741" text-anchor="middle" class="box-body">quota decisions</text>

  <rect x="745" y="620" width="250" height="145" class="box" fill="#fef2f2" stroke="#dc2626" filter="url(#shadow)"/>
  <text x="870" y="672" text-anchor="middle" class="box-title">Search Indexer</text>
  <text x="870" y="712" text-anchor="middle" class="box-body">Async full-text</text>
  <text x="870" y="741" text-anchor="middle" class="box-body">read model</text>

  <rect x="1035" y="620" width="250" height="145" class="box" fill="#f0fdf4" stroke="#059669" filter="url(#shadow)"/>
  <text x="1160" y="672" text-anchor="middle" class="box-title">Archival</text>
  <text x="1160" y="712" text-anchor="middle" class="box-body">Lifecycle rules,</text>
  <text x="1160" y="741" text-anchor="middle" class="box-body">cold object prefix</text>

  <rect x="1360" y="260" width="150" height="118" rx="22" fill="#ecfdf5" stroke="#059669" stroke-width="3" filter="url(#shadow)"/>
  <text x="1435" y="306" text-anchor="middle" class="box-title">Postgres</text>
  <text x="1435" y="344" text-anchor="middle" class="small">metadata,</text>
  <text x="1435" y="368" text-anchor="middle" class="small">quota, outbox</text>

  <rect x="1360" y="420" width="150" height="118" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="3" filter="url(#shadow)"/>
  <text x="1435" y="466" text-anchor="middle" class="box-title">MinIO</text>
  <text x="1435" y="504" text-anchor="middle" class="small">raw MIME,</text>
  <text x="1435" y="528" text-anchor="middle" class="small">attachments</text>

  <rect x="1360" y="580" width="150" height="118" rx="22" fill="#eef2ff" stroke="#4f46e5" stroke-width="3" filter="url(#shadow)"/>
  <text x="1435" y="626" text-anchor="middle" class="box-title">OpenSearch</text>
  <text x="1435" y="664" text-anchor="middle" class="small">derived</text>
  <text x="1435" y="688" text-anchor="middle" class="small">search index</text>

  <rect x="1360" y="740" width="150" height="118" rx="22" fill="#fff7ed" stroke="#f97316" stroke-width="3" filter="url(#shadow)"/>
  <text x="1435" y="786" text-anchor="middle" class="box-title">Archive</text>
  <text x="1435" y="824" text-anchor="middle" class="small">older email</text>
  <text x="1435" y="848" text-anchor="middle" class="small">content tier</text>

  <path class="soft-arrow" d="M705 432 L735 432" marker-end="url(#softArrow)"/>
  <path class="soft-arrow" d="M995 432 L1025 432" marker-end="url(#softArrow)"/>
  <path class="soft-arrow" d="M870 505 L870 610" marker-end="url(#softArrow)"/>
  <path class="soft-arrow" d="M1160 505 L1160 610" marker-end="url(#softArrow)"/>

  <path class="soft-arrow" d="M1285 404 L1350 320" marker-end="url(#softArrow)"/>
  <path class="soft-arrow" d="M1285 455 L1350 480" marker-end="url(#softArrow)"/>
  <path class="soft-arrow" d="M1285 660 L1350 640" marker-end="url(#softArrow)"/>
  <path class="soft-arrow" d="M1285 715 L1350 800" marker-end="url(#softArrow)"/>

  <rect x="455" y="905" width="850" height="122" rx="30" fill="url(#kafkaBg)" filter="url(#shadow)"/>
  <text x="880" y="958" text-anchor="middle" class="white-title">Kafka Event Bus</text>
  <text x="880" y="997" text-anchor="middle" class="white-small">email.received • index.requested • quota.updated • archival.requested</text>

  <path class="event-arrow" d="M580 765 L580 895" marker-end="url(#eventArrow)"/>
  <path class="event-arrow" d="M870 765 L870 895" marker-end="url(#eventArrow)"/>
  <path class="event-arrow" d="M1160 765 L1160 895" marker-end="url(#eventArrow)"/>
  <path class="event-arrow" d="M580 620 C580 575 580 550 580 515" marker-end="url(#eventArrow)"/>

  <rect x="112" y="848" width="260" height="150" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3" filter="url(#shadow)"/>
  <text x="242" y="905" text-anchor="middle" class="box-title">Core Rule</text>
  <text x="242" y="947" text-anchor="middle" class="box-body">Keep metadata hot.</text>
  <text x="242" y="976" text-anchor="middle" class="box-body">Move heavy content</text>
  <text x="242" y="1005" text-anchor="middle" class="box-body">off the request path.</text>

  <rect x="455" y="1060" width="850" height="52" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="880" y="1094" text-anchor="middle" class="small">Observability: correlation IDs, queue lag, indexing failures, quota rejections, storage growth, worker retries</text>

  <text x="116" y="1116" class="small">github.com/AbhinavMantri/mailvault</text>
</svg>
