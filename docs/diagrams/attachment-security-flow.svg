<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MailVault attachment security flow</title>
  <desc id="desc">Flow diagram showing attachment metadata extraction, SHA-256 deduplication, antivirus scanning, quarantine, and clean download enablement.</desc>
  <defs>
    <style>
      .title { font: 700 54px Arial, Helvetica, sans-serif; fill: #111827; }
      .subtitle { font: 400 24px Arial, Helvetica, sans-serif; fill: #4b5563; }
      .box-title { font: 700 22px Arial, Helvetica, sans-serif; fill: #111827; }
      .box-body { font: 400 16px Arial, Helvetica, sans-serif; fill: #374151; }
      .small { font: 400 14px Arial, Helvetica, sans-serif; fill: #4b5563; }
      .label { font: 700 16px Arial, Helvetica, sans-serif; fill: #334155; }
      .white-title { font: 700 26px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .white-small { font: 400 18px Arial, Helvetica, sans-serif; fill: #dbeafe; }
      .arrow { stroke: #334155; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .event-arrow { stroke: #ea580c; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .soft-arrow { stroke: #64748b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 9; }
      .box { stroke-width: 3; rx: 22; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <marker id="eventArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/>
    </marker>
    <marker id="softArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8fafc"/>
      <stop offset="0.56" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="scannerBg" x1="610" y1="682" x2="990" y2="782" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-12%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#pageBg)"/>
  <rect x="64" y="56" width="1472" height="888" rx="36" fill="#ffffff" fill-opacity="0.88" stroke="#d8e2ee" stroke-width="2"/>

  <text x="116" y="128" class="title">Attachment Security Flow</text>
  <text x="116" y="174" class="subtitle">Deduplicate files, scan before download, and quarantine unsafe content off the critical ingest path</text>

  <rect x="115" y="290" width="240" height="130" class="box" fill="#dbeafe" stroke="#2563eb" filter="url(#shadow)"/>
  <text x="235" y="342" text-anchor="middle" class="box-title">Email Stored</text>
  <text x="235" y="382" text-anchor="middle" class="box-body">Metadata committed</text>
  <text x="235" y="410" text-anchor="middle" class="box-body">objects in MinIO</text>

  <rect x="445" y="290" width="240" height="130" class="box" fill="#fff7ed" stroke="#f97316" filter="url(#shadow)"/>
  <text x="565" y="342" text-anchor="middle" class="box-title">Kafka Event</text>
  <text x="565" y="382" text-anchor="middle" class="box-body">email.received</text>
  <text x="565" y="410" text-anchor="middle" class="box-body">attachment pending</text>

  <rect x="775" y="290" width="240" height="130" class="box" fill="#eef2ff" stroke="#4f46e5" filter="url(#shadow)"/>
  <text x="895" y="334" text-anchor="middle" class="box-title">Attachment</text>
  <text x="895" y="362" text-anchor="middle" class="box-title">Worker</text>
  <text x="895" y="382" text-anchor="middle" class="box-body">Extract metadata</text>
  <text x="895" y="410" text-anchor="middle" class="box-body">compute SHA-256</text>

  <rect x="1105" y="290" width="240" height="130" class="box" fill="#ecfdf5" stroke="#16a34a" filter="url(#shadow)"/>
  <text x="1225" y="342" text-anchor="middle" class="box-title">Dedupe Check</text>
  <text x="1225" y="382" text-anchor="middle" class="box-body">Reuse known object</text>
  <text x="1225" y="410" text-anchor="middle" class="box-body">or store new hash</text>

  <path class="arrow" d="M355 355 L435 355" marker-end="url(#arrow)"/>
  <path class="event-arrow" d="M685 355 L765 355" marker-end="url(#eventArrow)"/>
  <path class="arrow" d="M1015 355 L1095 355" marker-end="url(#arrow)"/>

  <rect x="610" y="682" width="380" height="100" rx="28" fill="url(#scannerBg)" filter="url(#shadow)"/>
  <text x="800" y="726" text-anchor="middle" class="white-title">Antivirus Scanner</text>
  <text x="800" y="762" text-anchor="middle" class="white-small">Async scan with timeout, retry, and verdict</text>

  <path class="event-arrow" d="M1225 420 C1225 570 1030 705 1000 728" marker-end="url(#eventArrow)"/>
  <text x="1192" y="555" class="label">scan.requested</text>

  <rect x="245" y="645" width="250" height="145" class="box" fill="#f0fdf4" stroke="#16a34a" filter="url(#shadow)"/>
  <text x="370" y="697" text-anchor="middle" class="box-title">CLEAN</text>
  <text x="370" y="737" text-anchor="middle" class="box-body">Enable download</text>
  <text x="370" y="766" text-anchor="middle" class="box-body">include in quota</text>

  <rect x="1105" y="645" width="250" height="145" class="box" fill="#fef2f2" stroke="#dc2626" filter="url(#shadow)"/>
  <text x="1230" y="697" text-anchor="middle" class="box-title">INFECTED</text>
  <text x="1230" y="737" text-anchor="middle" class="box-body">Block download</text>
  <text x="1230" y="766" text-anchor="middle" class="box-body">quarantine object</text>

  <path class="arrow" d="M610 733 C555 733 527 733 505 733" marker-end="url(#arrow)"/>
  <path class="arrow" d="M990 733 C1045 733 1073 733 1095 733" marker-end="url(#arrow)"/>

  <rect x="610" y="830" width="380" height="54" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="800" y="852" text-anchor="middle" class="small">Postgres stores scan status:</text>
  <text x="800" y="872" text-anchor="middle" class="small">PENDING, SCANNING, CLEAN, INFECTED, FAILED, QUARANTINED</text>

  <path class="soft-arrow" d="M370 645 C430 560 535 505 775 405" marker-end="url(#softArrow)"/>
  <path class="soft-arrow" d="M1230 645 C1210 560 1190 500 1225 420" marker-end="url(#softArrow)"/>

  <rect x="112" y="830" width="350" height="54" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="287" y="852" text-anchor="middle" class="small">Rule: never serve attachments</text>
  <text x="287" y="872" text-anchor="middle" class="small">before a clean verdict</text>

  <text x="116" y="918" class="small">github.com/AbhinavMantri/mailvault</text>
</svg>
