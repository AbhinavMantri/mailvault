<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MailVault storage lifecycle flow</title>
  <desc id="desc">Flow diagram showing hot mailbox storage, lifecycle evaluation, archive movement, search continuity, and restore path.</desc>
  <defs>
    <style>
      .title { font: 700 54px Arial, Helvetica, sans-serif; fill: #F8FAFC; }
      .subtitle { font: 400 24px Arial, Helvetica, sans-serif; fill: #CBD5E1; }
      .box-title { font: 700 22px Arial, Helvetica, sans-serif; fill: #F8FAFC; }
      .box-body { font: 400 16px Arial, Helvetica, sans-serif; fill: #CBD5E1; }
      .small { font: 400 14px Arial, Helvetica, sans-serif; fill: #CBD5E1; }
      .label { font: 700 16px Arial, Helvetica, sans-serif; fill: #E2E8F0; }
      .white-title { font: 700 26px Arial, Helvetica, sans-serif; fill: #F8FAFC; }
      .white-small { font: 400 18px Arial, Helvetica, sans-serif; fill: #CFFAFE; }
      .arrow { stroke: #E2E8F0; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .soft-arrow { stroke: #94A3B8; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 9; }
      .cost-arrow { stroke: #34D399; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .box { stroke-width: 3; rx: 22; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#E2E8F0"/>
    </marker>
    <marker id="softArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/>
    </marker>
    <marker id="costArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#34D399"/>
    </marker>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.58" stop-color="#0B1726"/>
      <stop offset="1" stop-color="#0F1F2A"/>
    </linearGradient>
    <linearGradient id="archiveBg" x1="1038" y1="300" x2="1365" y2="445" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-12%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#pageBg)"/>
  <rect x="64" y="56" width="1472" height="888" rx="36" fill="#111827" fill-opacity="0.72"/>

  <text x="116" y="128" class="title">Storage Lifecycle Flow</text>
  <text x="116" y="174" class="subtitle">Keep recent mailbox access fast while moving old heavy content into a cheaper archival tier</text>

  <rect x="112" y="300" width="260" height="145" class="box" fill="#123B3A" stroke="#2DD4BF" filter="url(#shadow)"/>
  <text x="242" y="352" text-anchor="middle" class="box-title">Recent Email</text>
  <text x="242" y="392" text-anchor="middle" class="box-body">Metadata hot</text>
  <text x="242" y="421" text-anchor="middle" class="box-body">content in hot prefix</text>

  <rect x="455" y="300" width="260" height="145" class="box" fill="#173B2D" stroke="#34D399" filter="url(#shadow)"/>
  <text x="585" y="352" text-anchor="middle" class="box-title">Lifecycle Rule</text>
  <text x="585" y="392" text-anchor="middle" class="box-body">Age, size, access</text>
  <text x="585" y="421" text-anchor="middle" class="box-body">and policy checks</text>

  <rect x="790" y="300" width="260" height="145" class="box" fill="#4A3415" stroke="#FBBF24" filter="url(#shadow)"/>
  <text x="920" y="344" text-anchor="middle" class="box-title">Archival</text>
  <text x="920" y="372" text-anchor="middle" class="box-title">Worker</text>
  <text x="920" y="392" text-anchor="middle" class="box-body">Move raw content</text>
  <text x="920" y="421" text-anchor="middle" class="box-body">update object pointer</text>

  <rect x="1130" y="300" width="260" height="145" rx="24" fill="url(#archiveBg)" filter="url(#shadow)"/>
  <text x="1260" y="352" text-anchor="middle" class="white-title">Archive Tier</text>
  <text x="1260" y="392" text-anchor="middle" class="white-small">Older MIME bodies</text>
  <text x="1260" y="421" text-anchor="middle" class="white-small">and attachments</text>

  <path class="arrow" d="M372 372 L445 372" marker-end="url(#arrow)"/>
  <path class="arrow" d="M715 372 L780 372" marker-end="url(#arrow)"/>
  <path class="cost-arrow" d="M1050 372 L1120 372" marker-end="url(#costArrow)"/>
  <rect x="1035" y="326" width="105" height="28" rx="14" fill="#0B1726" stroke="#34D399" stroke-width="1.5"/>
  <text x="1087" y="346" text-anchor="middle" class="label">lower cost</text>

  <rect x="240" y="625" width="280" height="130" class="box" fill="#07111F" stroke="#94A3B8" filter="url(#shadow)"/>
  <text x="380" y="677" text-anchor="middle" class="box-title">Postgres</text>
  <text x="380" y="717" text-anchor="middle" class="box-body">Mailbox state stays hot</text>
  <text x="380" y="746" text-anchor="middle" class="box-body">object pointer changes</text>

  <rect x="660" y="625" width="280" height="130" class="box" fill="#252A55" stroke="#818CF8" filter="url(#shadow)"/>
  <text x="800" y="677" text-anchor="middle" class="box-title">OpenSearch</text>
  <text x="800" y="717" text-anchor="middle" class="box-body">Search still works</text>
  <text x="800" y="746" text-anchor="middle" class="box-body">from derived index</text>

  <rect x="1080" y="625" width="280" height="130" class="box" fill="#4A3415" stroke="#FBBF24" filter="url(#shadow)"/>
  <text x="1220" y="677" text-anchor="middle" class="box-title">Restore Path</text>
  <text x="1220" y="717" text-anchor="middle" class="box-body">Fetch archived object</text>
  <text x="1220" y="746" text-anchor="middle" class="box-body">slower but available</text>

  <path class="soft-arrow" d="M920 445 C850 555 585 625 520 675" marker-end="url(#softArrow)"/>
  <path class="soft-arrow" d="M1260 445 C1165 560 980 630 940 675" marker-end="url(#softArrow)"/>
  <path class="soft-arrow" d="M1260 445 C1260 535 1230 585 1220 615" marker-end="url(#softArrow)"/>

  <rect x="112" y="825" width="520" height="54" rx="18" fill="#111827" stroke="#E2E8F0" stroke-width="2"/>
  <text x="372" y="849" text-anchor="middle" class="small">Rule: archive heavy content,</text>
  <text x="372" y="869" text-anchor="middle" class="small">not mailbox state or search metadata</text>

  <rect x="800" y="825" width="560" height="54" rx="18" fill="#111827" stroke="#E2E8F0" stroke-width="2"/>
  <text x="1080" y="849" text-anchor="middle" class="small">Result: lower storage cost while preserving</text>
  <text x="1080" y="869" text-anchor="middle" class="small">search and retrieval semantics</text>

  <text x="116" y="918" class="small">github.com/AbhinavMantri/mailvault</text>
</svg>
