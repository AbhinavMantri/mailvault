<svg width="1800" height="1320" viewBox="0 0 1800 1320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MailVault high-level architecture</title>
  <desc id="desc">High-level architecture diagram for MailVault showing entry points, core services, Kafka events, async workers, storage systems, and SMTP delivery boundary.</desc>
  <defs>
    <style>
      .title { font: 700 54px Arial, Helvetica, sans-serif; fill: #F8FAFC; }
      .subtitle { font: 400 23px Arial, Helvetica, sans-serif; fill: #CBD5E1; }
      .lane-title { font: 700 22px Arial, Helvetica, sans-serif; fill: #E2E8F0; }
      .lane-note { font: 400 16px Arial, Helvetica, sans-serif; fill: #94A3B8; }
      .box-title { font: 700 24px Arial, Helvetica, sans-serif; fill: #F8FAFC; }
      .box-title-sm { font: 700 21px Arial, Helvetica, sans-serif; fill: #F8FAFC; }
      .box-body { font: 400 18px Arial, Helvetica, sans-serif; fill: #CBD5E1; }
      .box-body-sm { font: 400 16px Arial, Helvetica, sans-serif; fill: #CBD5E1; }
      .label { font: 700 15px Arial, Helvetica, sans-serif; fill: #E2E8F0; }
      .small { font: 400 16px Arial, Helvetica, sans-serif; fill: #CBD5E1; }
      .event-title { font: 700 28px Arial, Helvetica, sans-serif; fill: #F8FAFC; }
      .event-text { font: 400 18px Arial, Helvetica, sans-serif; fill: #CFFAFE; }
      .lane { fill: #0B1220; stroke: #263449; stroke-width: 2; rx: 26; }
      .box { stroke-width: 3; rx: 18; }
      .arrow { stroke: #E2E8F0; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .soft-arrow { stroke: #94A3B8; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 10 10; fill: none; }
      .event-arrow { stroke: #FBBF24; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .delivery-arrow { stroke: #38BDF8; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#E2E8F0"/>
    </marker>
    <marker id="softArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/>
    </marker>
    <marker id="eventArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#FBBF24"/>
    </marker>
    <marker id="deliveryArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#38BDF8"/>
    </marker>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1800" y2="1320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06111F"/>
      <stop offset="0.52" stop-color="#0B1726"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="kafkaBg" x1="470" y1="720" x2="1320" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#155E75"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-12%" width="120%" height="130%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#020617" flood-opacity="0.36"/>
    </filter>
  </defs>

  <rect width="1800" height="1320" fill="url(#pageBg)"/>

  <text x="90" y="105" class="title">MailVault Email Storage HLD</text>
  <text x="90" y="150" class="subtitle">Mailbox platform with durable writes, async workers, hybrid storage, local delivery, and SMTP testability</text>

  <rect x="70" y="210" width="310" height="520" class="lane"/>
  <text x="105" y="252" class="lane-title">Entry Points</text>
  <text x="105" y="280" class="lane-note">User-facing API boundary</text>

  <rect x="105" y="340" width="240" height="120" class="box" fill="#123B3A" stroke="#2DD4BF" filter="url(#shadow)"/>
  <text x="225" y="388" text-anchor="middle" class="box-title">Client Apps</text>
  <text x="225" y="425" text-anchor="middle" class="box-body">Compose and read</text>

  <path class="arrow" d="M225 460 L225 535" marker-end="url(#arrow)"/>
  <text x="252" y="505" class="label">HTTP</text>

  <rect x="105" y="545" width="240" height="120" class="box" fill="#0E3A4A" stroke="#22D3EE" filter="url(#shadow)"/>
  <text x="225" y="593" text-anchor="middle" class="box-title">API Layer</text>
  <text x="225" y="630" text-anchor="middle" class="box-body">Auth and routing</text>

  <rect x="430" y="210" width="910" height="430" class="lane"/>
  <text x="468" y="252" class="lane-title">Core Services</text>
  <text x="468" y="280" class="lane-note">The critical path stores durable truth first.</text>

  <path class="arrow" d="M345 605 L420 605 L420 405 L490 405" marker-end="url(#arrow)"/>
  <text x="372" y="584" class="label">service calls</text>

  <rect x="500" y="340" width="245" height="130" class="box" fill="#252A55" stroke="#818CF8" filter="url(#shadow)"/>
  <text x="622" y="390" text-anchor="middle" class="box-title">Ingestion</text>
  <text x="622" y="428" text-anchor="middle" class="box-body">Persist message</text>
  <text x="622" y="456" text-anchor="middle" class="box-body">Write outbox</text>

  <rect x="815" y="340" width="245" height="130" class="box" fill="#173B2D" stroke="#34D399" filter="url(#shadow)"/>
  <text x="938" y="390" text-anchor="middle" class="box-title">Mailbox</text>
  <text x="938" y="428" text-anchor="middle" class="box-body">Threads</text>
  <text x="938" y="456" text-anchor="middle" class="box-body">Folders</text>

  <rect x="1125" y="340" width="170" height="130" class="box" fill="#34224F" stroke="#A78BFA" filter="url(#shadow)"/>
  <text x="1210" y="390" text-anchor="middle" class="box-title-sm">Search API</text>
  <text x="1210" y="428" text-anchor="middle" class="box-body-sm">User search</text>

  <rect x="585" y="535" width="245" height="90" class="box" fill="#183549" stroke="#38BDF8" filter="url(#shadow)"/>
  <text x="708" y="572" text-anchor="middle" class="box-title-sm">Local Delivery</text>
  <text x="708" y="606" text-anchor="middle" class="box-body-sm">Recipient inbox copy</text>

  <rect x="920" y="535" width="245" height="90" class="box" fill="#4A3415" stroke="#FBBF24" filter="url(#shadow)"/>
  <text x="1042" y="572" text-anchor="middle" class="box-title-sm">Outbox</text>
  <text x="1042" y="606" text-anchor="middle" class="box-body-sm">Event handoff</text>

  <path class="arrow" d="M745 405 L805 405" marker-end="url(#arrow)"/>
  <path class="arrow" d="M1060 405 L1115 405" marker-end="url(#arrow)"/>
  <path class="delivery-arrow" d="M622 470 L622 500 L708 500 L708 525" marker-end="url(#deliveryArrow)"/>
  <path class="event-arrow" d="M745 450 L1042 450 L1042 525" marker-end="url(#eventArrow)"/>

  <rect x="430" y="695" width="910" height="155" class="lane"/>
  <rect x="470" y="720" width="830" height="100" rx="26" fill="url(#kafkaBg)" filter="url(#shadow)"/>
  <text x="885" y="762" text-anchor="middle" class="event-title">Kafka Event Bus</text>
  <text x="885" y="798" text-anchor="middle" class="event-text">email.received • attachment.uploaded • delivery.requested</text>

  <path class="event-arrow" d="M1042 625 L1042 710" marker-end="url(#eventArrow)"/>

  <rect x="430" y="900" width="910" height="250" class="lane"/>
  <text x="468" y="942" class="lane-title">Async Workers</text>
  <text x="468" y="970" class="lane-note">Workers scale independently from user traffic.</text>

  <rect x="500" y="1010" width="225" height="105" class="box" fill="#4A3415" stroke="#FBBF24" filter="url(#shadow)"/>
  <text x="612" y="1052" text-anchor="middle" class="box-title-sm">Quota Service</text>
  <text x="612" y="1087" text-anchor="middle" class="box-body-sm">Storage usage</text>

  <rect x="775" y="1010" width="225" height="105" class="box" fill="#4A1F2A" stroke="#F87171" filter="url(#shadow)"/>
  <text x="888" y="1052" text-anchor="middle" class="box-title-sm">Search Indexer</text>
  <text x="888" y="1087" text-anchor="middle" class="box-body-sm">Index writer</text>

  <rect x="1050" y="1010" width="250" height="105" class="box" fill="#0F1F2A" stroke="#34D399" filter="url(#shadow)"/>
  <text x="1175" y="1052" text-anchor="middle" class="box-title-sm">Attachment Worker</text>
  <text x="1175" y="1087" text-anchor="middle" class="box-body-sm">Hash and dedupe</text>

  <path class="event-arrow" d="M612 820 L612 875 L740 875 L740 1062 L725 1062" marker-end="url(#eventArrow)"/>
  <path class="event-arrow" d="M888 820 L888 1000" marker-end="url(#eventArrow)"/>
  <path class="event-arrow" d="M1175 820 L1175 1000" marker-end="url(#eventArrow)"/>

  <rect x="1390" y="210" width="320" height="520" class="lane"/>
  <text x="1428" y="252" class="lane-title">Storage Systems</text>
  <text x="1428" y="280" class="lane-note">Durable and derived state</text>

  <rect x="1430" y="340" width="230" height="92" rx="18" fill="#173B2D" stroke="#34D399" stroke-width="3" filter="url(#shadow)"/>
  <text x="1545" y="378" text-anchor="middle" class="box-title-sm">Postgres</text>
  <text x="1545" y="408" text-anchor="middle" class="box-body-sm">metadata, outbox</text>

  <rect x="1430" y="470" width="230" height="92" rx="18" fill="#4A3415" stroke="#FBBF24" stroke-width="3" filter="url(#shadow)"/>
  <text x="1545" y="508" text-anchor="middle" class="box-title-sm">MinIO</text>
  <text x="1545" y="538" text-anchor="middle" class="box-body-sm">objects, files</text>

  <rect x="1430" y="600" width="230" height="92" rx="18" fill="#252A55" stroke="#818CF8" stroke-width="3" filter="url(#shadow)"/>
  <text x="1545" y="638" text-anchor="middle" class="box-title-sm">OpenSearch</text>
  <text x="1545" y="668" text-anchor="middle" class="box-body-sm">search index</text>

  <rect x="1390" y="795" width="320" height="355" class="lane"/>
  <text x="1428" y="837" class="lane-title">Delivery Boundary</text>
  <text x="1428" y="865" class="lane-note">External mail stays isolated</text>

  <rect x="1430" y="940" width="230" height="105" rx="18" fill="#183549" stroke="#38BDF8" stroke-width="3" filter="url(#shadow)"/>
  <text x="1545" y="982" text-anchor="middle" class="box-title-sm">Delivery Service</text>
  <text x="1545" y="1017" text-anchor="middle" class="box-body-sm">SMTP send</text>

  <rect x="1430" y="1080" width="230" height="70" rx="18" fill="#0F1F2A" stroke="#38BDF8" stroke-width="3" filter="url(#shadow)"/>
  <text x="1545" y="1110" text-anchor="middle" class="box-title-sm">SMTP / GreenMail</text>
  <text x="1545" y="1138" text-anchor="middle" class="box-body-sm">local test server</text>

  <path class="soft-arrow" d="M622 340 L622 310 L1360 310 L1360 386 L1420 386" marker-end="url(#softArrow)"/>
  <path class="soft-arrow" d="M622 470 L622 500 L1360 500 L1360 516 L1420 516" marker-end="url(#softArrow)"/>
  <path class="soft-arrow" d="M1295 405 L1360 405 L1360 646 L1420 646" marker-end="url(#softArrow)"/>

  <path class="delivery-arrow" d="M1300 770 L1365 770 L1365 992 L1420 992" marker-end="url(#deliveryArrow)"/>
  <path class="delivery-arrow" d="M1545 1045 L1545 1070" marker-end="url(#deliveryArrow)"/>

  <rect x="70" y="900" width="310" height="145" rx="22" fill="#07111F" stroke="#2DD4BF" stroke-width="2" filter="url(#shadow)"/>
  <text x="225" y="952" text-anchor="middle" class="box-title">Core Rule</text>
  <text x="225" y="993" text-anchor="middle" class="box-body-sm">Metadata stays hot.</text>
  <text x="225" y="1020" text-anchor="middle" class="box-body-sm">Heavy work is async.</text>

  <rect x="470" y="1210" width="830" height="48" rx="16" fill="#0B1220" stroke="#263449" stroke-width="2"/>
  <text x="885" y="1241" text-anchor="middle" class="small">Observability: correlation IDs, queue lag, failures, retries</text>

  <text x="90" y="1241" class="small">github.com/AbhinavMantri/mailvault</text>
</svg>
