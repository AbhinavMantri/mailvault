server:
  port: 8081

spring:
  application:
    name: ingestion-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mailvault}
    username: ${DB_USERNAME:mailvault}
    password: ${DB_PASSWORD:mailvault}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

mailvault:
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:mailvault}
    secret-key: ${MINIO_SECRET_KEY:mailvault-secret}
    bucket: ${MINIO_BUCKET:mailvault-emails}
  kafka:
    email-received-topic: ${EMAIL_RECEIVED_TOPIC:email.received}
    attachment-uploaded-topic: ${ATTACHMENT_UPLOADED_TOPIC:attachment.uploaded}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
