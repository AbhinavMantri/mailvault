server:
  port: 8083

spring:
  application:
    name: quota-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mailvault}
    username: ${DB_USERNAME:mailvault}
    password: ${DB_PASSWORD:mailvault}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.mailvault.quota.events.EmailReceivedEvent

mailvault:
  kafka:
    email-received-topic: ${EMAIL_RECEIVED_TOPIC:email.received}
    consumer-group-id: ${QUOTA_CONSUMER_GROUP_ID:mailvault-quota-service}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
